# Manual: release `vX.Y.Z` from a staging tag, then the previous staging tags are deleted.
name: Production

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Staging tag to release (empty for the latest)
        required: false

permissions: {}

jobs:
  release:
    name: Release
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: read
      actions: read
    uses: Berack96/workflows/.github/workflows/release.yml@v0.4.0
    with:
      from: v{YYYY}.{MM}-staging.{NNN}
      from-tag: ${{ inputs.tag }}
      from-workflow: staging.yml
      prune: true

# Lint, tests and security checks for PRs.
name: PR

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

# Draft in the group: a skipped draft run must not cancel the ready one.
concurrency:
  group: pr-${{ github.ref }}-${{ github.event.pull_request.draft }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    if: ${{ !github.event.pull_request.draft }}
    permissions:
      contents: read
    uses: Berack96/workflows/.github/workflows/test.yml@v1.0.0
    with:
      mise: true
      # `lint` reformats without failing: check the format first.
      run: |
        mise run lint:check
        mise run lint
        mise run test

  security:
    name: Security
    if: ${{ !github.event.pull_request.draft }}
    permissions:
      contents: read
      pull-requests: write
    uses: Berack96/workflows/.github/workflows/security.yml@v1.0.0

# Toolchain del progetto, gestita da mise-en-place (https://mise.jdx.dev).
# Installa tutti i tools con `mise install`, poi configura il repository con `mise run setup`.

# Versione minima di mise: è quella usata dalla CI (Berack96/workflows).
min_version = "2026.10.9"

[tools]
# Componenti espliciti: mise installa il profilo minimal, senza rustfmt e clippy.
rust = { version = "1.99.1", components = "rustfmt,clippy" }


# ==============================================
# Tutti i tasks di mise sono definiti qui sotto
# ==============================================

[tasks.setup]
description = "Configura git per il progetto (regole e hooks di .gitconfig)"
run = "git config --local include.path ../.gitconfig"

[tasks.lint]
description = "Formatta il codice Rust e lo controlla con clippy"
run = [
    "cargo fmt --all",
    "cargo clippy --all-targets --all-features -- -D warnings",
]

[tasks."lint:check"]
description = "Verifica che il codice Rust sia formattato, senza modificare i file (usato dall'hook pre-commit)"
hide = true
run = "cargo fmt --all -- --check"

[tasks.test]
description = "Esegue i test"
run = "cargo test --all-features"


# Project toolchain, managed by mise-en-place (https://mise.jdx.dev).
# Install all tools with `mise install`, then configure the repository with `mise run setup`.

# Minimum mise version: the one used by CI (Berack96/workflows).
min_version = "2026.10.9"

[tools]
# Explicit components: mise installs the minimal profile, without rustfmt and clippy.
rust = { version = "1.99.1", components = "rustfmt,clippy" }


# ==============================================
# All mise tasks are defined below
# ==============================================

[tasks.setup]
description = "Configure git for the project (rules and hooks from .gitconfig)"
run = "git config --local include.path ../.gitconfig"

[tasks.lint]
description = "Format the Rust code and check it with clippy"
run = [
    "cargo fmt --all",
    "cargo clippy --all-targets --all-features -- -D warnings",
]

[tasks."lint:check"]
description = "Check that the Rust code is formatted, without modifying files (used by the pre-commit hook)"
hide = true
run = "cargo fmt --all -- --check"

[tasks.test]
description = "Run the tests"
run = "cargo test --all-features"


# Toolchain del progetto, gestita da mise-en-place (https://mise.jdx.dev).
# Installa tutti i tools con `mise install`, poi configura il repository con `mise run setup`.

# Versione minima di mise: è quella usata dalla CI (Berack96/workflows).
min_version = "2026.10.9"

[tools]
# Esempi: versioni sempre fissate, così locale e CI usano le stesse.
# rust = { version = "1.99.1", components = "rustfmt,clippy" }
# uv = "0.10.12"
# node = "24.11.0"
# "github:Berack96/env-sync" = "0.1.0"

# [env]
# Carica .env nell'ambiente dei comandi di mise; con env-sync viene allineato a .env.example da `setup`.
# _.file = ".env"


# ==============================================
# Tutti i tasks di mise sono definiti qui sotto
# ==============================================

[tasks.setup]
description = "Configura git per il progetto (regole e hooks di .gitconfig)"
run = [
    "git config --local include.path ../.gitconfig",
    # "env-sync",
    "echo '✅ Setup completato. Aggiungi qui i passi di setup del progetto (dipendenze, .env, ...).'",
]

# I task qui sotto sono segnaposto: li usano l'hook pre-commit e la CI (.github/workflows/pr.yml).
[tasks.lint]
description = "Formatta il codice e lo controlla con i linter"
run = "echo 'Nessun linter configurato: modifica il task lint in .mise.toml'"

[tasks."lint:check"]
description = "Verifica che il codice sia formattato, senza modificare i file (usato dall'hook pre-commit)"
hide = true
run = "echo 'Nessun controllo di formato configurato: modifica il task lint:check in .mise.toml'"

[tasks.test]
description = "Esegue i test"
run = "echo 'Nessun test configurato: modifica il task test in .mise.toml'"
